<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aquavar Pump Dashboard</title>
<link rel="stylesheet" href="/static/uplot.min.css">
<style>
  :root {
    --bg: #0b1220;
    --panel: #121c30;
    --panel-2: #17233c;
    --border: #24324d;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.4;
    padding: 16px 20px 32px;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 12px;
  }
  h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .muted { color: var(--muted); }
  #updated { font-size: 12px; margin-left: 10px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 999px; font-size: 13px;
    font-weight: 600; text-transform: capitalize;
    background: #1e293b; border: 1px solid var(--border); color: var(--muted);
  }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pill.running { color: var(--green); border-color: rgba(34,197,94,.4); background: rgba(34,197,94,.08); }
  .pill.stopped { color: var(--muted); }
  .pill.fault { color: var(--red); border-color: rgba(239,68,68,.45); background: rgba(239,68,68,.1); }
  .pill.alarm { color: var(--amber); border-color: rgba(245,158,11,.45); background: rgba(245,158,11,.1); }
  .pill.idle { color: #60a5fa; }

  .banner {
    display: none; margin-bottom: 12px; padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel); font-weight: 550;
  }
  .banner.show { display: block; }
  .banner.fault { border-color: rgba(239,68,68,.5); background: rgba(239,68,68,.1); color: #fecaca; }
  .banner.alarm { border-color: rgba(245,158,11,.5); background: rgba(245,158,11,.1); color: #fde68a; }

  .tiles {
    display: grid; gap: 10px; margin-bottom: 14px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  .tile {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; min-width: 0;
  }
  .tile-label { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile-value { display: flex; align-items: baseline; gap: 5px; margin-top: 2px; }
  .tile-value .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tile-value .u { color: var(--muted); font-size: 12px; }

  main { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

  .controls {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; position: sticky; top: 12px; max-height: calc(100vh - 40px); overflow: auto;
  }
  .ranges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .ranges button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 5px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .ranges button:hover { border-color: #3b4a68; }
  .ranges button.active { background: var(--accent); border-color: var(--accent); color: white; }

  .group { margin-bottom: 12px; }
  .group-title {
    color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .7px; margin-bottom: 5px;
  }
  .series-item {
    display: flex; align-items: center; gap: 8px; padding: 3px 2px;
    cursor: pointer; border-radius: 5px; user-select: none;
  }
  .series-item:hover { background: rgba(148,163,184,.08); }
  .series-item input { accent-color: var(--accent); margin: 0; cursor: pointer; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .series-item span:last-child { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .chart-wrap {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 12px 6px; min-width: 0;
  }
  .chart-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 6px; flex-wrap: wrap;
  }
  #windowLabel { color: var(--muted); font-size: 12px; }
  #resetZoom {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 5px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  #resetZoom:hover { border-color: #3b4a68; }
  #chart { width: 100%; min-height: 460px; }
  .u-legend { font-size: 12px; }
  .u-legend .u-marker { border-radius: 2px; }
  footer { color: var(--muted); font-size: 11px; margin-top: 14px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Aquavar Pump Dashboard</h1>
    <span id="updated" class="muted">connecting…</span>
  </div>
  <div id="status" class="pill">connecting</div>
</header>

<section id="banner" class="banner"></section>
<section class="tiles" id="tiles"></section>

<main>
  <aside class="controls">
    <div class="ranges" id="ranges"></div>
    <div id="seriesList"></div>
  </aside>

  <section class="chart-wrap">
    <div class="chart-head">
      <span id="windowLabel">Loading…</span>
      <button id="resetZoom" type="button">Reset zoom</button>
    </div>
    <div id="chart"></div>
  </section>
</main>

<footer>
  Scroll or drag to zoom · range buttons set the starting window ·
  double-click or “Reset zoom” to return.
  Data is sampled at 1 Hz and kept in RAM for 7 days (cleared on reboot).
</footer>

<script src="/static/uplot.iife.min.js"></script>
<script>
(function () {
  "use strict";

  const RANGES = [
    { id: "1h",  label: "1h",  ms: 1 * 3600e3 },
    { id: "6h",  label: "6h",  ms: 6 * 3600e3 },
    { id: "24h", label: "24h", ms: 24 * 3600e3 },
    { id: "48h", label: "48h", ms: 48 * 3600e3 },
    { id: "72h", label: "72h", ms: 72 * 3600e3 },
    { id: "7d",  label: "7d",  ms: 7 * 86400e3 },
  ];
  const TILE_KEYS = [
    "pressure", "setpoint", "motor_freq_hz", "motor_current_a",
    "motor_power_kw", "dc_bus_v", "drive_temp_c", "energy_kwh",
  ];
  const MIN_SPAN_MS = 5 * 1000;        // don't zoom in past a few samples
  const MAX_SPAN_MS = 7 * 86400e3;     // matches server retention
  const ZOOM_DEBOUNCE_MS = 200;        // refetch after the wheel settles

  const $ = (id) => document.getElementById(id);
  const chartEl = $("chart");
  const statusEl = $("status");
  const updatedEl = $("updated");
  const bannerEl = $("banner");
  const windowEl = $("windowLabel");

  let meta = null;
  let fieldByKey = new Map();
  let selected = new Set();
  let latest = null;
  let plot = null;
  let plotKey = "";
  let currentFrom = 0;
  let currentTo = 0;
  let activeRange = "24h";
  let zoomed = false;
  let zoomTimer = null;
  let fetchSeq = 0;
  let resizeObserver = null;
  let downX = null;
  let downY = null;

  function fmtNum(value) {
    if (value === null || value === undefined || Number.isNaN(value)) return "—";
    const abs = Math.abs(value);
    if (abs >= 1000) return value.toLocaleString(undefined, { maximumFractionDigits: 0 });
    if (abs >= 100) return value.toFixed(0);
    if (abs >= 10) return value.toFixed(1);
    const text = value.toFixed(2).replace(/\.?0+$/, "");
    return text === "" || text === "-0" ? "0" : text;
  }

  function unitOf(field) {
    if (field.unit === "process") {
      const unit = latest && latest.sample && latest.sample.process_unit;
      return unit || "psi";
    }
    return field.unit;
  }

  function safeJson(text) {
    try {
      const value = JSON.parse(text || "[]");
      return Array.isArray(value) ? value : [];
    } catch (err) {
      return [];
    }
  }

  // ---------------------------------------------------------------- controls
  function buildRanges() {
    const box = $("ranges");
    box.innerHTML = "";
    RANGES.forEach((range) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = range.label;
      button.dataset.range = range.id;
      button.addEventListener("click", () => setRange(range.id));
      box.appendChild(button);
    });
  }

  function updateRangeButtons() {
    document.querySelectorAll("#ranges button").forEach((button) => {
      button.classList.toggle("active", !zoomed && button.dataset.range === activeRange);
    });
  }

  function buildSeriesList() {
    const box = $("seriesList");
    box.innerHTML = "";
    const groups = new Map();
    meta.fields.forEach((field) => {
      if (!groups.has(field.group)) groups.set(field.group, []);
      groups.get(field.group).push(field);
    });

    for (const [name, fields] of groups) {
      const group = document.createElement("div");
      group.className = "group";
      const title = document.createElement("div");
      title.className = "group-title";
      title.textContent = name;
      group.appendChild(title);

      fields.forEach((field) => {
        const label = document.createElement("label");
        label.className = "series-item";
        label.title = field.label + " (" + unitOf(field) + ")";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = field.key;
        checkbox.checked = selected.has(field.key);
        checkbox.addEventListener("change", () => {
          if (checkbox.checked) selected.add(field.key);
          else selected.delete(field.key);
          rebuildPlot();
        });

        const swatch = document.createElement("span");
        swatch.className = "swatch";
        swatch.style.background = field.color;

        const text = document.createElement("span");
        text.textContent = field.label;

        label.append(checkbox, swatch, text);
        group.appendChild(label);
      });
      box.appendChild(group);
    }
  }

  function buildTiles() {
    const box = $("tiles");
    box.innerHTML = "";
    TILE_KEYS.forEach((key) => {
      const field = fieldByKey.get(key);
      if (!field) return;
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.dataset.key = key;

      const label = document.createElement("div");
      label.className = "tile-label";
      label.textContent = field.label;

      const value = document.createElement("div");
      value.className = "tile-value";
      const number = document.createElement("span");
      number.className = "v";
      number.textContent = "—";
      const unit = document.createElement("span");
      unit.className = "u";
      unit.textContent = field.unit === "process" ? "" : field.unit;
      value.append(number, unit);

      tile.append(label, value);
      box.appendChild(tile);
    });
  }

  function updateTiles(sample) {
    document.querySelectorAll(".tile").forEach((tile) => {
      const field = fieldByKey.get(tile.dataset.key);
      if (!field) return;
      const value = sample ? sample[field.key] : null;
      tile.querySelector(".v").textContent = fmtNum(value);
      tile.querySelector(".u").textContent = sample ? unitOf(field) : "";
    });
  }

  function updateStatus(data) {
    const sample = data && data.sample;
    if (!sample) {
      statusEl.textContent = "no data";
      statusEl.className = "pill stopped";
      updatedEl.textContent = "waiting for first sample…";
      updateTiles(null);
      bannerEl.className = "banner";
      return;
    }

    const summary = String(sample.status || "unknown").toLowerCase();
    statusEl.textContent = summary;
    if (summary.includes("fault")) statusEl.className = "pill fault";
    else if (summary.includes("alarm")) statusEl.className = "pill alarm";
    else if (summary.includes("running")) statusEl.className = "pill running";
    else if (summary.includes("stop") || summary.includes("not ready")) statusEl.className = "pill stopped";
    else statusEl.className = "pill idle";

    const when = new Date(sample.ts);
    updatedEl.textContent = "last sample " + when.toLocaleTimeString() +
      " · " + fmtNum(sample.dur_ms) + " ms";

    const faults = safeJson(sample.faults_active);
    const alarms = safeJson(sample.alarms_active);
    const parts = [];
    if (faults.length) parts.push("Active faults: " + faults.join(", "));
    if (alarms.length) parts.push("Active alarms: " + alarms.join(", "));
    if (!faults.length && summary.includes("fault") && sample.fault_last > 0) {
      parts.push("Last fault: " + sample.fault_last_name + " (" + sample.fault_last + ")");
    }
    if (parts.length) {
      bannerEl.textContent = parts.join(" · ");
      bannerEl.className = "banner show " + (faults.length ? "fault" : "alarm");
    } else {
      bannerEl.className = "banner";
    }

    updateTiles(sample);
  }

  // ------------------------------------------------------------------ chart
  function makeOptions(keys) {
    const fields = keys.map((key) => fieldByKey.get(key)).filter(Boolean);

    const units = [];
    fields.forEach((field) => {
      const unit = unitOf(field);
      if (!units.includes(unit)) units.push(unit);
    });

    const scales = { x: { time: true } };
    const scaleFor = {};
    units.forEach((unit, index) => {
      const key = "y" + index;
      scaleFor[unit] = key;
      scales[key] = { auto: true };
    });

    const axes = [{
      stroke: "#94a3b8",
      grid: { stroke: "rgba(148,163,184,0.12)" },
      ticks: { stroke: "rgba(148,163,184,0.3)" },
      font: "11px system-ui, sans-serif",
    }];

    units.forEach((unit, index) => {
      axes.push({
        scale: scaleFor[unit],
        side: index % 2 === 0 ? 3 : 1, // 3 = left, 1 = right
        label: unit,
        labelSize: 18,
        size: 60,
        space: 55,
        stroke: "#94a3b8",
        grid: { show: index === 0, stroke: "rgba(148,163,184,0.12)" },
        ticks: { stroke: "rgba(148,163,184,0.3)" },
        font: "11px system-ui, sans-serif",
      });
    });

    const series = [{
      label: "Time",
      value: (u, value) => (value == null ? "—" : new Date(value * 1000).toLocaleString()),
    }];

    fields.forEach((field) => {
      series.push({
        label: field.label,
        stroke: field.color,
        width: 1.6,
        scale: scaleFor[unitOf(field)],
        spanGaps: false,
        points: { show: false },
        value: (u, value) => (value == null ? "—" : fmtNum(value) + " " + unitOf(field)),
      });
    });

    return {
      width: Math.max(320, chartEl.clientWidth),
      height: 460,
      padding: [10, 10, 0, 10],
      cursor: {
        drag: { setScale: true, x: true, y: false, dist: 6 },
        points: { show: false },
      },
      legend: { show: true, live: true },
      scales: scales,
      axes: axes,
      series: series,
    };
  }

  function applyXScale(min, max) {
    if (!plot || !Number.isFinite(min) || !Number.isFinite(max)) return;
    plot.setScale("x", { min: min, max: max });
  }

  function renderSeries(payload, fields) {
    const key = fields.join(",");
    const data = [payload.t].concat(fields.map((field) => payload.series[field] || []));

    if (!plot || key !== plotKey) {
      if (plot) plot.destroy();
      plot = new uPlot(makeOptions(fields), data, chartEl);
      plotKey = key;
      window.__plot = plot; // handy for browser-console debugging

      // uPlot's built-in double-click autoscales to the loaded data; intercept
      // it in the capture phase so the range buttons stay authoritative.
      plot.over.addEventListener("dblclick", (event) => {
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
        setRange(activeRange);
      }, true);
      plot.over.addEventListener("mousedown", (event) => {
        downX = event.clientX;
        downY = event.clientY;
      });
      plot.over.addEventListener("mouseup", onMouseUp);
      plot.over.addEventListener("wheel", onWheel, { passive: false });

      if (resizeObserver) resizeObserver.disconnect();
      resizeObserver = new ResizeObserver(() => {
        if (plot) plot.setSize({ width: Math.max(320, chartEl.clientWidth), height: 460 });
      });
      resizeObserver.observe(chartEl);
    } else {
      plot.setData(data, false);
    }

    applyXScale(currentFrom / 1000, currentTo / 1000);
  }

  function onMouseUp(event) {
    if (downX === null) return;
    const moved = Math.hypot(event.clientX - downX, event.clientY - downY);
    downX = null;
    downY = null;
    if (moved < 6) return; // a click, not a drag

    requestAnimationFrame(() => {
      if (!plot) return;
      const min = plot.scales.x.min;
      const max = plot.scales.x.max;
      if (!Number.isFinite(min) || !Number.isFinite(max)) return;
      if (Math.abs(min - currentFrom / 1000) > 0.5 || Math.abs(max - currentTo / 1000) > 0.5) {
        scheduleZoom(min, max);
      }
    });
  }

  function onWheel(event) {
    if (!plot) return;
    const scale = plot.scales.x;
    const min = scale.min;
    const max = scale.max;
    if (!Number.isFinite(min) || !Number.isFinite(max) || max <= min) return;

    event.preventDefault();

    const rect = plot.over.getBoundingClientRect();
    if (rect.width <= 0) return;
    const px = Math.min(Math.max(event.clientX - rect.left, 0), rect.width);
    const anchor = plot.posToVal(px, "x");
    if (!Number.isFinite(anchor)) return;

    // deltaMode 1 is lines (Firefox), 2 is pages; normalise to pixels.
    const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? rect.height : 1;
    const delta = event.deltaY * unit;
    const factor = Math.exp(delta * 0.0015);
    const span = max - min;
    const newSpan = Math.min(
      Math.max(span * factor, MIN_SPAN_MS / 1000),
      MAX_SPAN_MS / 1000
    );
    const ratio = (anchor - min) / span;

    let newMin = anchor - ratio * newSpan;
    let newMax = newMin + newSpan;

    // Keep the window inside the server's retention range.
    const now = Date.now() / 1000;
    const earliest = now - MAX_SPAN_MS / 1000;
    if (newMin < earliest) {
      newMin = earliest;
      newMax = earliest + newSpan;
    }
    if (newMax > now) {
      newMax = now;
      newMin = now - newSpan;
    }
    if (newMin < earliest || newMax - newMin < MIN_SPAN_MS / 1000) return;

    plot.setScale("x", { min: newMin, max: newMax });
    scheduleZoom(newMin, newMax);
  }

  function scheduleZoom(min, max) {
    const from = Math.round(min * 1000);
    const to = Math.round(max * 1000);
    if (to - from < MIN_SPAN_MS) {
      applyXScale(currentFrom / 1000, currentTo / 1000);
      return;
    }

    zoomed = true;
    updateRangeButtons();
    // Move the target immediately so an in-flight response cannot snap the
    // chart back to the previous window while the refetch is debounced.
    currentFrom = from;
    currentTo = to;
    clearTimeout(zoomTimer);
    zoomTimer = setTimeout(() => {
      loadSeries(currentFrom, currentTo);
    }, ZOOM_DEBOUNCE_MS);
  }

  async function loadSeries(from, to) {
    const fields = Array.from(selected);
    if (!fields.length) {
      if (plot) {
        plot.destroy();
        plot = null;
        plotKey = "";
      }
      windowEl.textContent = "No series selected";
      return;
    }

    const seq = ++fetchSeq;
    let payload;
    try {
      const response = await fetch(
        "/api/series?from=" + from + "&to=" + to +
        "&fields=" + encodeURIComponent(fields.join(","))
      );
      if (!response.ok) throw new Error("HTTP " + response.status);
      payload = await response.json();
    } catch (err) {
      if (seq === fetchSeq) windowEl.textContent = "Load failed: " + err.message;
      return;
    }
    if (seq !== fetchSeq) return;

    renderSeries(payload, fields);

    const bucket = payload.bucket_ms >= 60000
      ? (payload.bucket_ms / 60000).toFixed(1) + " min"
      : (payload.bucket_ms / 1000).toFixed(0) + " s";
    windowEl.textContent =
      new Date(from).toLocaleString() + " → " + new Date(to).toLocaleString() +
      " · " + payload.t.length + " points · " + bucket + " buckets";
  }

  function rebuildPlot() {
    clearTimeout(zoomTimer);
    if (plot) {
      plot.destroy();
      plot = null;
      plotKey = "";
    }
    if (currentFrom && currentTo) loadSeries(currentFrom, currentTo);
  }

  function setRange(id) {
    const range = RANGES.find((item) => item.id === id);
    if (!range) return;
    clearTimeout(zoomTimer);
    activeRange = id;
    zoomed = false;
    const to = Date.now();
    const from = to - range.ms;
    currentFrom = from;
    currentTo = to;
    updateRangeButtons();
    loadSeries(from, to);
  }

  // ------------------------------------------------------------------ polling
  async function refreshLatest() {
    try {
      const response = await fetch("/api/latest");
      if (!response.ok) throw new Error("HTTP " + response.status);
      latest = await response.json();
      updateStatus(latest);
    } catch (err) {
      statusEl.textContent = "offline";
      statusEl.className = "pill stopped";
    }
  }

  async function init() {
    buildRanges();

    try {
      const response = await fetch("/api/meta");
      if (!response.ok) throw new Error("HTTP " + response.status);
      meta = await response.json();
    } catch (err) {
      statusEl.textContent = "offline";
      statusEl.className = "pill stopped";
      windowEl.textContent = "Cannot reach the dashboard API.";
      return;
    }

    fieldByKey = new Map(meta.fields.map((field) => [field.key, field]));
    selected = new Set(meta.default_fields);

    buildSeriesList();
    buildTiles();
    await refreshLatest();
    setRange("24h");

    $("resetZoom").addEventListener("click", () => setRange(activeRange));

    setInterval(refreshLatest, 2000);

    setInterval(() => {
      if (document.hidden || zoomed) return;
      const range = RANGES.find((item) => item.id === activeRange);
      if (!range) return;
      const to = Date.now();
      const from = to - range.ms;
      currentFrom = from;
      currentTo = to;
      loadSeries(from, to);
    }, 10000);
  }

  init();
})();
</script>
</body>
</html>
